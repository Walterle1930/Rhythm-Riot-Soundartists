<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Crew Console</title>
  <style>
    :root{
      --bg:#EBEEED; --surface:#F6F8F7; --raised:#FFFFFF;
      --ink:#11171A; --ink-2:#4B585C; --line:#CFD6D6; --line-2:#E0E5E5;
      --accent:#2F3FE4; --accent-ink:#FFFFFF; --accent-soft:#DCE0FA;
      --ok:#1B7A4B; --ok-soft:#D7EEDF; --warn:#8F5A00; --warn-soft:#F6E7C6; --crit:#BF2C1A; --crit-soft:#F8DAD5;
      --scrim:rgba(10,14,16,.55);
      --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
      --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
      --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box}
    html, body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--ink);
      font:400 15px/1.5 var(--f-body);
    }
    body{
      padding:0 16px 56px;
    }
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    h1,h2,h3,p{margin:0}
    .wrap{max-width:1180px;margin:0 auto}
    .top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
    .top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px 0 0}
    .brand{display:flex;align-items:center;gap:10px;padding-bottom:12px}
    .brand svg{width:26px;height:26px;color:var(--accent);flex:none}
    .brand b{font:800 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
    .nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
    .nav::-webkit-scrollbar{display:none}
    .nav button{background:none;border:0;padding:10px 14px 12px;color:var(--ink-2);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
    .nav button:hover{color:var(--ink)}
    .nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
    .nav .count{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--line-2);font:500 11px var(--f-mono);color:var(--ink-2)}
    .langbox{display:flex;gap:6px;margin-left:auto;padding-bottom:12px}
    .langbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;color:var(--ink-2)}
    .langbtn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    main{padding-top:28px;display:flex;flex-direction:column;gap:28px}
    .vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
    .vhead h1{font:800 clamp(34px,6vw,52px)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
    .lede{color:var(--ink-2);margin-top:6px;max-width:62ch}
    .label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:4px;border:1px solid var(--line);background:var(--raised);font-weight:600}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .btn.primary:hover{filter:brightness(1.08)}
    .btn.ghost{background:none}
    .btn.sm{padding:5px 10px;font-size:13px}
    .btn.danger{color:var(--crit);border-color:var(--crit-soft);background:none}
    .icon-btn{display:grid;place-items:center;width:34px;height:34px;border:0;background:none;border-radius:4px;color:var(--ink-2);flex:none}
    .icon-btn:hover{background:var(--line-2);color:var(--ink)}
    .icon-btn svg{width:16px;height:16px}
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
    .seg button{background:none;border:0;padding:6px 14px;color:var(--ink-2);font-size:13px;font-weight:700}
    .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;min-width:0}
    .grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
    .grid2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 32px;align-items:start}
    .count{font:800 clamp(88px,15vw,148px)/.82 var(--f-display);letter-spacing:-.01em;color:var(--accent);font-variant-numeric:tabular-nums}
    .count small{display:block;font:600 12px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin-top:10px}
    .hero h2{font:800 clamp(28px,4.4vw,40px)/1 var(--f-display);text-transform:uppercase}
    .hero .sub{color:var(--ink-2);margin-top:4px}
    .hero ul{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:6px}
    .hero li{display:flex;gap:10px;align-items:center;min-width:0}
    .hero li .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;flex:none}
    .hero li .tt{flex:1;min-width:0;overflow-wrap:anywhere}
    .stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
    .step{display:flex;flex-direction:column;gap:6px;color:var(--ink-2);min-width:0}
    .step .bar{display:block;height:8px;background:var(--line);border-radius:1px}
    .step.on .bar{background:var(--accent)}
    .step.cur{color:var(--ink)}
    .step.cur .bar{height:12px;margin-top:-2px}
    .step .lbl{font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;line-height:1.5;border:1px solid var(--line);background:none;white-space:nowrap}
    .pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
    .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
    .pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
    .pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
    .av{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;font:600 12px/1 var(--f-body);letter-spacing:.02em;background:hsl(var(--h) 45% 85%);color:hsl(var(--h) 55% 26%)}
    .av.sm{width:24px;height:24px;font-size:10px}
    .av.lg{width:48px;height:48px;font-size:16px}
    .avs{display:flex}.avs .av + .av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
    .rows{display:flex;flex-direction:column}
    .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2);min-width:0}
    .row:first-child{border-top:0;padding-top:0}
    .row .grow{flex:1;min-width:0}
    .row .name{font-weight:700;overflow-wrap:anywhere}
    .row .sub{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
    .srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
    .srow:first-child{border-top:0;padding-top:0}
    .srow .t{font-size:13px;color:var(--ink-2);white-space:nowrap}
    .pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
    .pcol{padding:14px 14px 16px;border-left:1px solid var(--line-2);min-width:0}
    .pcol:first-child{border-left:0}
    .pcol h3{display:flex;justify-content:space-between;align-items:baseline;font:700 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px}
    .pcol h3 span{font:500 12px var(--f-mono);color:var(--ink-2)}
    .pcol button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 0;border-top:1px solid var(--line-2);overflow-wrap:anywhere}
    .pcol button:hover{color:var(--accent)}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
    .card .top2{display:flex;gap:14px;align-items:center;min-width:0}
    .card .who{flex:1;min-width:0}
    .card .who b{display:block;font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
    .card .who span{color:var(--ink-2);font-size:14px}
    .card .focus{font-size:14px;min-height:2.9em;overflow-wrap:anywhere}
    .card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line-2);padding-top:12px;flex-wrap:wrap}
    .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
    .kcol{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:120px}
    .kcol h3{display:flex;justify-content:space-between;align-items:baseline;font:700 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
    .kcol h3 span{font:500 12px var(--f-mono);color:var(--ink-2)}
    .kcard{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
    .kcard .tt{font-weight:700;overflow-wrap:anywhere}
    .kcard .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--ink-2)}
    .kcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
    .sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
    select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0;width:100%}
    textarea{resize:vertical;line-height:1.45}
    .taskrows{display:flex;flex-direction:column}
    .trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
    .trow:first-of-type{border-top:0}
    .chk{width:24px;height:24px;border:2px solid var(--ink-2);background:none;border-radius:4px;display:grid;place-items:center;padding:0;color:transparent;flex:none}
    .chk.checked{background:var(--ok);border-color:var(--ok);color:var(--bg)}
    .trow .tt{overflow-wrap:anywhere;font-weight:700}
    .trow .tm{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:2px;font-size:13px;color:var(--ink-2)}
    .trow .td{font:500 13px var(--f-mono);text-align:right;white-space:nowrap}
    .trow .td small{display:block;font:400 11px var(--f-body);color:var(--ink-2)}
    .wk{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
    .wk .range{font:500 14px var(--f-mono);min-width:15ch}
    .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;background:var(--surface)}
    .day{padding:12px 12px 14px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px;min-width:0;min-height:180px}
    .day:first-child{border-left:0}
    .day header{display:flex;justify-content:space-between;align-items:center;gap:6px;padding-bottom:8px;border-bottom:2px solid var(--line)}
    .day header b{font:700 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
    .day header span{font:400 12px var(--f-mono);color:var(--ink-2)}
    .sess{width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
    .sess .t{font:500 12px var(--f-mono);color:var(--accent)}
    .sess b{font-weight:700;font-size:14px;overflow-wrap:anywhere}
    .sess .r{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
    .day .add{margin-top:auto;align-self:flex-start;background:none;border:0;color:var(--ink-2);font-size:13px;padding:4px 0}
    .orow{display:grid;grid-template-columns:minmax(0,1.6fr) auto auto auto;gap:10px 20px;align-items:center;padding:16px 20px;border-top:1px solid var(--line-2)}
    .orow:first-child{border-top:0}
    .orow .on{font:500 13px var(--f-mono);color:var(--accent)}
    .orow .oc{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
    .orow .os{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
    .orow .sum{font:500 16px var(--f-mono);text-align:right;white-space:nowrap}
    .orow .btns{display:flex;gap:6px;align-items:center}
    .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
    .rcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
    .rph{aspect-ratio:4/3;display:grid;place-items:center;background:hsl(var(--h) 45% 85%);color:hsl(var(--h) 55% 26%);font:800 72px/1 var(--f-display);overflow:hidden}
    .rph img{width:100%;height:100%;object-fit:cover;display:block}
    .rbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
    .rbody h3{font:800 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
    .rbody .rr{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
    .rbody p{font-size:14px;overflow-wrap:anywhere}
    .overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
    .overlay[hidden]{display:none}
    .modal{background:var(--raised);border:1px solid var(--line);border-radius:6px;width:100%;max-width:560px;margin-block:auto;padding:22px}
    .modal h2{font:800 30px/1 var(--f-display);text-transform:uppercase;margin:0 0 18px}
    .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .fld{display:flex;flex-direction:column;gap:5px;grid-column:1 / -1;min-width:0}
    .fld.half{grid-column:auto}
    .fld label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
    .mactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px}
    .mactions .spacer{flex:1}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;max-width:calc(100vw - 32px);font-size:14px}
    .empty{color:var(--ink-2);padding:6px 0 2px}
    @media (max-width:820px){.grid2,.grid2b{grid-template-columns:minmax(0,1fr)}}
    @media (max-width:980px){.days{grid-template-columns:minmax(0,1fr)}.day{border-left:0;border-top:1px solid var(--line-2);min-height:0}.day:first-child{border-top:0}}
    @media (max-width:760px){.orow{grid-template-columns:minmax(0,1fr) auto}.orow .st{grid-column:1}.orow .btns{grid-column:1 / -1}}
    @media (max-width:560px){.hero{grid-template-columns:minmax(0,1fr)}.trow{grid-template-columns:auto minmax(0,1fr) auto}.trow .icon-btn{display:none}}
    @media (max-width:480px){.fld.half{grid-column:1 / -1}}
  </style>
</head>

        assignee:'Responsable',
        project:'Projet',
        due:'Échéance',
        priority:'Priorité',
        urgent:'Urgent',
        normal:'Normal',
        empty:'Vide',
        pdf:'PDF',
        addPoint:'+ Élément',
        addVersion:'+ Version',
        addParticipant:'+ Contributeur',
        noChecklist:'Aucune entrée dans la checklist.',
        noVersions:'Aucune version pour le moment.',
        back:'Retour',
        noData:'Aucune donnée pour le moment.',
        de:'DE', en:'EN', fr:'FR'
      }
    };

    const STAGES = ['Writing','Recording','Editing','Mix','Master','Release'];
    const STATUS = { studio:'Im Studio', remote:'Remote', frei:'Verfügbar', weg:'Abwesend' };
    const STATUS_ORDER = ['studio','remote','frei','weg'];

    const state = {
      lang: 'de',
      view: 'overview',
      teamFilter: 'all',
      taskMode: 'board',
      projectMode: 'list',
      taskFilters: { assignee: '', project: '', done: false },
      weekOffset: 0,
      curProject: null
    };

    const defaultData = {
      members: {
        m1:{id:'m1',name:'Mara Stein',role:'Producer',status:'studio',focus:'Mixing für neue Single',bio:'Songarchitekt mit Fokus auf emotionale Dynamik.',roster:'ja'},
        m2:{id:'m2',name:'Noah West',role:'Toningenieur',status:'remote',focus:'Mastering-Check',bio:'Detailorientierter Engineer mit Fokus auf Tiefe und Klarheit.',roster:'ja'},
        m3:{id:'m3',name:'Sophie Brand',role:'Sängerin',status:'frei',focus:'Vocals und Arrangement',bio:'Lead Vocals und Harmonien mit starkem Charakter.',roster:'ja'},
        m4:{id:'m4',name:'Elias Kahn',role:'Gitarrist',status:'weg',focus:'Neues Album',bio:'Gitarren, Looping und Klangfarben.',roster:'ja'}
      },
      projects: {
        p1:{id:'p1',title:'Night City',artist:'Mara Stein',type:'Single',stage:2,release:'2026-11-04',lead:'m1',bpm:118,key:'A-Moll'},
        p2:{id:'p2',title:'Cold Echo',artist:'Noah West',type:'EP',stage:1,release:'2026-11-20',lead:'m2',bpm:96,key:'F#'}
      },
      tasks: {
        t1:{id:'t1',title:'Vocal Comp fertig',project:'p1',assignee:'m3',due:'2026-10-27',prio:'hoch',status:'doing',done:false},
        t2:{id:'t2',title:'Mix-Feedback einarbeiten',project:'p1',assignee:'m1',due:'2026-10-29',prio:'normal',status:'review',done:false},
        t3:{id:'t3',title:'Mastering-Listen checken',project:'p2',assignee:'m2',due:'2026-10-24',prio:'hoch',status:'todo',done:false},
        t4:{id:'t4',title:'Artwork finalisieren',project:'p2',assignee:'m4',due:'2026-10-31',prio:'normal',status:'done',done:true}
      },
      sessions: {
        s1:{id:'s1',title:'Vocal Recording',date:'2026-10-23',start:'10:00',end:'12:30',room:'Vocal Booth',project:'p1',who:['m3','m1']},
        s2:{id:'s2',title:'Mix Session',date:'2026-10-23',start:'13:00',end:'16:00',room:'Control Room',project:'p1',who:['m1','m2']}
      },
      absences: { a1:{id:'a1',member:'m4',from:'2026-10-25',to:'2026-10-30',note:'Tour'}},
      orders: {
        o1:{id:'o1',number:'AB-2026-0001',customer:'Midnight Echo',project:'p1',date:'2026-10-20',delivery:'2026-11-05',itemsText:'Mixing Single | 1 | 450\nMastering | 1 | 180',note:'Schneller Release',status:'confirmed'}
      },
      splits: { sp1:{id:'sp1',project:'p1',name:'Mara Stein',role:'Komposition',comp:50,master:60} },
      versions: { v1:{id:'v1',project:'p1',label:'Mix v1',kind:'Mix',date:'2026-10-22',link:'https://example.com/mix-v1',status:'review',notes:'Erster Mix'}},
      checks: { c1:{id:'c1',project:'p1',group:'Rechtliches',label:'ISRC vergeben',done:true}, c2:{id:'c2',project:'p1',group:'Marketing',label:'Playlist-Pitching planen',done:false}},
      feedback: {},
      settings: { studio:{name:'North Coast Studio',address:'Musterstraße 12\n20457 Hamburg',email:'hello@northcoast.studio',phone:'+49 40 123456',taxId:'DE123456789',iban:'DE89 3704 0044 0532 0130 00',bic:'COBADEFFXXX',vat:19,payDays:14} }
    };

    let data = loadData();
    function loadData() {
      try { const raw = localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); } catch(e) {}
      return structuredClone(defaultData);
    }
    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
    }

    const app = document.getElementById('app');
    const nav = document.getElementById('nav');
    const overlay = document.getElementById('overlay');
    const toastEl = document.getElementById('toast');
    const langbox = document.getElementById('langbox');

    function esc(v='') {
      return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'
      }[c]));
    }

    function t(key) {
      return LANGS[state.lang][key] || LANGS.de[key] || key;
    }

    function asList(obj) {
      return Object.values(obj || {});
    }

    function uid(prefix='id') {
      return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
    }

    function parseDate(value) {
      if (!value) return null;
      const d = new Date(value + 'T00:00:00');
      return isNaN(d) ? null : d;
    }

    function fmtDate(value) {
      if (!value) return '';
      const d = parseDate(value);
      return d ? d.toLocaleDateString(state.lang === 'en' ? 'en-US' : state.lang === 'fr' ? 'fr-FR' : 'de-DE', {
        day:'2-digit', month:'2-digit', year:'numeric'
      }) : value;
    }

    function fmtShort(value) {
      if (!value) return '';
      const d = parseDate(value);
      return d ? d.toLocaleDateString(state.lang === 'en' ? 'en-US' : state.lang === 'fr' ? 'fr-FR' : 'de-DE', {
        day:'2-digit', month:'2-digit'
      }) : value;
    }

    function diffDays(a, b) {
      const da = parseDate(a), db = parseDate(b);
      if (!da || !db) return null;
      return Math.round((da - db) / 86400000);
    }

    function money(value) {
      return new Intl.NumberFormat(state.lang === 'en' ? 'en-US' : state.lang === 'fr' ? 'fr-FR' : 'de-DE', {
        style:'currency', currency:'EUR'
      }).format(Number(value || 0));
    }

    function hue(str) {
      let h = 0;
      for (const ch of String(str || '')) h = (h * 31 + ch.charCodeAt(0)) % 360;
      return h;
    }

    function avatar(name, size = '') {
      const n = String(name || '?').trim();
      const initials = n.split(/\s+/).slice(0,2).map(part => part[0] || '').join('').toUpperCase() || '?';
      return `<span class="av ${size}" style="--h:${hue(name)}">${esc(initials)}</span>`;
    }

    function getMemberById(id) { return data.members[id] || null; }
    function getProjectById(id) { return data.projects[id] || null; }
    function getMemberName(id) { const m = getMemberById(id); return m ? m.name : '—'; }
    function getProjectTitle(id) { const p = getProjectById(id); return p ? p.title : t('empty'); }

    function statusLabel(status) { return STATUS[status] || 'Verfügbar'; }
    function statusClass(status) { return { studio:'ok', remote:'acc', frei:'', weg:'warn' }[status] || ''; }

    function relText(n) {
      if (n === 0) return 'heute';
      if (n === 1) return 'morgen';
      if (n === -1) return 'gestern';
      return n > 0 ? 'in ' + n + ' Tagen' : 'seit ' + (-n) + ' Tagen';
    }

    function stepper(project) {
      const stage = Number(project.stage || 0);
      return `<div class="stepper" role="group" aria-label="Produktionsphase">${STAGES.map((name, i) => {
        const on = i <= stage;
        const cur = i === stage;
        return `<span class="step${on ? ' on' : ''}${cur ? ' cur' : ''}"><i class="bar"></i><span class="lbl">${name}</span></span>`;
      }).join('')}</div>`;
    }

    function relPill(project) {
      if (Number(project.stage || 0) >= 5) return '<span class="pill ok">'+t('done')+'</span>';
      const today = new Date().toISOString().slice(0,10);
      const n = diffDays(project.release, today);
      if (n === null) return '<span class=\"pill\">'+t('noRelease')+'</span>';
      if (n < 0) return '<span class=\"pill crit\">'+t('nextRelease')+' '+(-n)+' Tage</span>';
      if (n <= 14) return '<span class=\"pill warn\">'+t('nextRelease')+' '+relText(n)+'</span>';
      return '<span class=\"pill\">'+t('nextRelease')+' '+relText(n)+'</span>';
    }

    function pchip(projectId) {
      const project = getProjectById(projectId);
      if (!project) return '';
      return `<span class="chip" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)"><i style="width:8px;height:8px;border-radius:2px;background:hsl(${hue(project.title)} 55% 50%)"></i>${esc(project.title)}</span>`;
    }

    const ICON_EDIT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 14h3l8-8-3-3-8 8z"/><path d="M9 4l3 3"/></svg>';
    const ICON_CHECK = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7.5l3.2 3L12 3.5"/></svg>';

    function editBtn(kind, id, label) {
      return `<button class="icon-btn" type="button" data-act="edit" data-kind="${kind}" data-id="${esc(id)}" aria-label="${esc(label)} bearbeiten">${ICON_EDIT}</button>`;
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.hidden = false;
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toastEl.hidden = true; }, 3200);
    }

    function vhead(title, sub, actions = '') {
      return `<div class="vhead"><div><h1>${esc(title)}</h1>${sub ? `<p class="lede">${esc(sub)}</p>` : ''}</div>${actions ? `<div class="acts">${actions}</div>` : ''}</div>`;
    }

    function renderLangSwitcher() {
      const langs = ['de','en','fr'];
      langbox.innerHTML = langs.map(code => `
        <button type="button" class="langbtn ${state.lang === code ? 'active' : ''}" data-lang="${code}">${t(code)}</button>
      `).join('');
    }

    function renderNav() {
      const openCount = asList(data.tasks).filter(t => !t.done).length;
      const items = [
        ['overview', t('overview')],
        ['team', t('team')],
        ['projects', t('projects')],
        ['tasks', t('tasks')],
        ['calendar', t('calendar')],
        ['orders', t('orders')],
        ['roster', t('roster')],
        ['inquiry', t('inquiry')]
      ];
      nav.innerHTML = items.map(([key,label]) => `
        <button type="button" data-act="nav" data-view="${key}" ${state.view === key ? 'aria-current="page"' : ''}>
          ${label}
          ${key === 'tasks' && openCount ? `<span class="count">${openCount}</span>` : ''}
        </button>
      `).join('');
    }

    function renderOverview() {
      const today = new Date().toISOString().slice(0,10);
      const projects = asList(data.projects);
      const members = asList(data.members).sort((a,b) => (a.name || '').localeCompare(b.name || ''));
      const tasks = asList(data.tasks);

      const nextList = projects.filter(p => p.release).map(p => ({p, diff: diffDays(p.release, today)})).filter(x => x.diff !== null).sort((a,b) => a.diff - b.diff);
      const next = nextList.find(x => x.diff >= 0) || nextList[0];

      const hero = next ? `
        <section class="panel hero">
          <div class="count">${Math.abs(next.diff)}<small>${next.diff < 0 ? 'Tage überfällig' : next.diff === 1 ? 'Tag bis Release' : 'Tage bis Release'}</small></div>
          <div>
            <div class="label">${t('nextRelease')} · ${fmtDate(next.p.release)}</div>
            <h2><button type="button" data-act="open-project" data-id="${next.p.id}" style="background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;text-align:left">${esc(next.p.title)}</button></h2>
            <div class="sub">${esc([next.p.artist, next.p.type].filter(Boolean).join(' · '))}</div>
            ${stepper(next.p)}
            <ul>
              ${tasks.filter(t => t.project === next.p.id && !t.done).slice(0,4).map(t => `
                <li>
                  <span class="dot"></span>
                  <span class="tt">${esc(t.title)}</span>
                  ${t.due ? `<span class="mono" style="margin-left:auto;font-size:12px;color:var(--ink-2)">${fmtDate(t.due)}</span>` : ''}
                </li>
              `).join('') || '<li><span class="dot"></span><span class="tt">Keine offenen Aufgaben für dieses Projekt.</span></li>'}
            </ul>
          </div>
        </section>
      ` : `<section class="panel"><span class="label">${t('nextRelease')}</span><p class="empty">${t('noRelease')}</p></section>`;

      const people = `
        <section class="panel">
          <span class="label">${t('teamToday')}</span>
          <div class="rows">
            ${members.length ? members.map(m => `
              <div class="row">
                ${avatar(m.name,'sm')}
                <div class="grow">
                  <div class="name">${esc(m.name)}</div>
                  <div class="sub">${esc(m.role || '')}</div>
                </div>
                <button class="pill ${statusClass(m.status)}" type="button" data-act="status" data-id="${m.id}">${esc(statusLabel(m.status))}</button>
              </div>
            `).join('') : `<p class="empty">${t('noMembers')}</p>`}
          </div>
        </section>
      `;

      const todaySessions = asList(data.sessions).filter(s => s.date === today);
      const sessionPanel = `
        <section class="panel">
          <span class="label">Heute im Studio</span>
          ${todaySessions.length ? todaySessions.map(s => {
            const peopleList = (s.who || []).map(getMemberById).filter(Boolean);
            return `
              <div class="srow">
                <span class="t mono">${esc(s.start || '')}–${esc(s.end || '')}</span>
                <div>
                  <div class="name"><b>${esc(s.title)}</b></div>
                  <div class="sub">${esc([s.room, getProjectTitle(s.project)].filter(Boolean).join(' · '))}</div>
                </div>
                <div class="avs">${peopleList.slice(0,4).map(m => avatar(m.name,'sm')).join('')}</div>
              </div>
            `;
          }).join('') : `<p class="empty">${t('noSessions')}</p>`}
        </section>
      `;

      const due = tasks.filter(t => !t.done && t.due && diffDays(t.due, today) <= 7).sort((a,b) => String(a.due || '9999').localeCompare(String(b.due || '9999'))).slice(0,6);
      const duePanel = `
        <section class="panel">
          <span class="label">${t('dueSoon')}</span>
          ${due.length ? `<div class="rows">${due.map(t => { const n = diffDays(t.due, today); return `
            <div class="row">
              <div class="grow">
                <div class="name">${esc(t.title)}</div>
                <div class="sub">${esc(getMemberName(t.assignee))}${getProjectTitle(t.project) ? ' · ' + esc(getProjectTitle(t.project)) : ''}</div>
              </div>
              <span class="pill ${n < 0 ? 'crit' : n <= 1 ? 'warn' : ''}">${n < 0 ? 'überfällig' : relText(n)}</span>
            </div>
          `; }).join('')}</div>` : `<p class="empty">${t('noDue')}</p>`}
        </section>
      `;

      const pipe = `
        <div class="pipe">
          ${STAGES.map((name, idx) => {
            const items = projects.filter(p => Number(p.stage) === idx).sort((a,b) => String(a.release || '9999').localeCompare(String(b.release || '9999')));
            return `
              <div class="pcol">
                <h3>${name}<span>${items.length}</span></h3>
                ${items.length ? items.slice(0,6).map(p => `<button type="button" data-act="open-project" data-id="${p.id}">${esc(p.title)}</button>`).join('') : '<p class=\"empty\">'+t('empty')+'</p>'}
              </div>
            `;
          }).join('')}
        </div>
      `;

      return vhead('Überblick', 'Das Wichtigste für das Team auf einen Blick.', `<button class="btn primary" type="button" data-act="add" data-kind="project">${t('addProject')}</button>`)
        + `<div class="grid2">${hero}${people}</div>`
        + `<div class="grid2b">${sessionPanel}${duePanel}</div>`
        + `<section><h2 class="label" style="margin-bottom:12px">${t('pipeline')}</h2>${pipe}</section>`;
    }

    function renderTeam() {
      const members = asList(data.members).sort((a,b) => (a.name || '').localeCompare(b.name || ''));
      const chips = [['all', t('all')]].concat(STATUS_ORDER.map(k => [k, STATUS[k]]));
      const filtered = state.teamFilter === 'all' ? members : members.filter(m => m.status === state.teamFilter);

      return vhead('Team', 'Wer ist gerade im Studio und woran arbeitet er oder sie?', `<button class="btn primary" type="button" data-act="add" data-kind="member">${t('addMember')}</button>`)
        + `<div class="chips">${chips.map(([k,label]) => `<button class="fchip" type="button" data-act="team-filter" data-v="${k}" aria-pressed="${state.teamFilter===k}">${label}</button>`).join('')}</div>`
        + (filtered.length ? `<div class="cards">${filtered.map(m => {
          const absence = asList(data.absences).find(a => a.member === m.id && a.from && a.to && a.from <= new Date().toISOString().slice(0,10) && new Date().toISOString().slice(0,10) <= a.to);
          const openCount = asList(data.tasks).filter(t => t.assignee === m.id && !t.done).length;
          return `<article class="card">
            <div class="top2">
              ${avatar(m.name,'lg')}
              <div class="who"><b>${esc(m.name)}</b><span>${esc(m.role || 'Ohne Rolle')}</span></div>
              ${editBtn('member', m.id, m.name)}
            </div>
            <div class="focus">${esc(m.focus || 'Kein Fokus eingetragen')}</div>
            <div class="foot">
              <span class="pill ${statusClass(m.status)}">${esc(statusLabel(m.status))}</span>
              ${absence ? `<span class="pill warn">weg bis ${fmtDate(absence.to)}</span>` : ''}
              <span class="mono" style="font-size:12px;color:var(--ink-2)">${openCount} offen</span>
            </div>
          </article>`;
        }).join('')}</div>` : `<p class="empty">${t('noMembers')}</p>`);
    }

    function renderProjects() {
      const projects = asList(data.projects).sort((a,b) => ((a.stage >= 5) - (b.stage >= 5)) || String(a.release || '9999').localeCompare(String(b.release || '9999')));
      const toggle = `<div class="seg">${[['list','Liste'],['board','Board']].map(([k,label]) => `<button type="button" data-act="project-mode" data-v="${k}" aria-pressed="${state.projectMode===k}">${label}</button>`).join('')}</div>`;

      if (state.projectMode === 'board') {
        return vhead('Projekte', 'Von der ersten Idee bis zum Release.', `${toggle}<button class="btn primary" type="button" data-act="add" data-kind="project">${t('addProject')}</button>`)
          + `<div class="board">${STAGES.map((name, idx) => {
            const arr = projects.filter(p => Number(p.stage) === idx);
            return `<section class="kcol"><h3>${name}<span>${arr.length}</span></h3>${arr.map(p => {
              const lead = getMemberById(p.lead);
              return `<article class="kcard">
                <div class="tt"><button type="button" data-act="open-project" data-id="${p.id}" style="background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit">${esc(p.title)}</button></div>
                <div class="meta"><span>${esc([p.artist,p.type].filter(Boolean).join(' · '))}</span></div>
                <div class="foot">
                  <div>${relPill(p)}</div>
                  <div class="mv">
                    ${idx > 0 ? `<button class="icon-btn" type="button" data-act="move-project" data-id="${p.id}" data-to="${idx-1}">←</button>` : ''}
                    ${idx < 5 ? `<button class="icon-btn" type="button" data-act="move-project" data-id="${p.id}" data-to="${idx+1}">→</button>` : ''}
                  </div>
                </div>
                ${lead ? `<div class="meta">${avatar(lead.name,'sm')} ${esc(lead.name.split(' ')[0])}</div>` : ''}
              </article>`;
            }).join('') || '<p class=\"empty\">'+t('empty')+'</p>'}</section>`;
          }).join('')}</div>`;
      }

      return vhead('Projekte', 'Von der ersten Idee bis zum Release.', `${toggle}<button class="btn primary" type="button" data-act="add" data-kind="project">${t('addProject')}</button>`)
        + `<div class="plist">${projects.map(p => {
          const tasks = asList(data.tasks).filter(t => t.project === p.id);
          const done = tasks.filter(t => t.done).length;
          const pc = tasks.length ? Math.round(done / tasks.length * 100) : 0;
          const lead = getMemberById(p.lead);
          return `<article class="proj${Number(p.stage) >= 5 ? ' done' : ''}">
            <div style="min-width:0">
              <h3><button type="button" data-act="open-project" data-id="${p.id}">${esc(p.title)}</button></h3>
              <p class="sub">${esc([p.artist,p.type].filter(Boolean).join(' · '))}</p>
              ${p.release ? `<div class="meta"><span>${fmtDate(p.release)}</span></div>` : ''}
            </div>
            <div class="mid">
              ${stepper(p)}
              <div class="prog"><div class="track"><i style="width:${pc}%"></i></div><span class="mono">${done}/${tasks.length} Aufgaben</span></div>
            </div>
            <div class="end">
              ${relPill(p)}
              ${lead ? `<div style="display:flex;align-items:center;gap:6px">${avatar(lead.name,'sm')}<span style="font-size:13px;color:var(--ink-2)">${esc(lead.name.split(' ')[0])}</span></div>` : ''}
              ${editBtn('project', p.id, p.title)}
            </div>
          </article>`;
        }).join('')}</div>`;
    }

    function taskStatus(task) {
      return task.done ? 'done' : (task.status && task.status !== 'done' ? task.status : 'todo');
    }

    function taskRow(task) {
      const n = task.due ? diffDays(task.due, new Date().toISOString().slice(0,10)) : null;
      const late = !task.done && n !== null && n < 0;
      const member = getMemberById(task.assignee);
      const status = taskStatus(task);
      return `<div class="trow${task.done ? ' is-done' : ''}">
        <button class="chk ${task.done ? 'checked' : ''}" type="button" data-act="toggle-task" data-id="${task.id}">${ICON_CHECK}</button>
        <div style="min-width:0">
          <div class="tt">${esc(task.title)}${task.prio === 'hoch' ? ` <span class="pill crit">${t('urgent')}</span>` : ''}${status === 'doing' ? ` <span class="pill acc">${t('inWork')}</span>` : status === 'review' ? ` <span class="pill warn">Review</span>` : ''}</div>
          <div class="tm">${pchip(task.project)}<span style="display:inline-flex;align-items:center;gap:6px">${member ? avatar(member.name,'sm') + esc(member.name.split(' ')[0]) : '<span>Nicht zugewiesen</span>'}</span></div>
        </div>

    function toISODate(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2,'0');
      const day = String(dateObj.getDate()).padStart(2,'0');
      return `${year}-${month}-${day}`;
    }

    function monday(date) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return d;
    }

    function isoWeek(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const jan1 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - jan1) / 86400000) + 1) / 7);
    }

    function renderCalendar() {
      const base = monday(new Date());
      base.setDate(base.getDate() + state.weekOffset * 7);
      const days = Array.from({ length: 7 }, (_, idx) => {
        const d = new Date(base);
        d.setDate(base.getDate() + idx);
        return d;
      });
      const today = toISODate(new Date());
      const allSessions = asList(data.sessions);

      const navRow = `
        <div class="wk">
          <button class="btn sm" type="button" data-act="week" data-d="-1">←</button>
          <span class="range">KW ${isoWeek(days[0])} · ${fmtShort(toISODate(days[0]))}–${fmtShort(toISODate(days[6]))}</span>
          <button class="btn sm" type="button" data-act="week" data-d="1">→</button>
          ${state.weekOffset ? '<button class="btn sm ghost" type="button" data-act="week" data-d="0">Diese Woche</button>' : ''}
        </div>
      `;

      const cols = days.map(d => {
        const key = toISODate(d);
        const sessions = allSessions.filter(s => s.date === key).sort((a,b) => String(a.start).localeCompare(String(b.start)));
        const away = asList(data.members).filter(m => asList(data.absences).some(a => a.member === m.id && a.from && a.to && a.from <= key && key <= a.to));
        return `
          <section class="day${key === today ? ' today' : ''}">
            <header>
              <b>${new Intl.DateTimeFormat(state.lang === 'en' ? 'en-US' : state.lang === 'fr' ? 'fr-FR' : 'de-DE', { weekday: 'short' }).format(d).replace('.', '')}</b>
              <span>${fmtShort(key)}</span>
            </header>
            ${away.length ? `<span class="pill warn" style="align-self:flex-start;white-space:normal">Abwesend: ${away.map(m => m.name.split(' ')[0]).join(', ')}</span>` : ''}
            ${sessions.map(s => {
              const ppl = (s.who || []).map(getMemberById).filter(Boolean);
              return `<button class="sess" type="button" data-act="edit" data-kind="session" data-id="${s.id}">
                <span class="t">${esc(s.start || '')}–${esc(s.end || '')}</span>
                <b>${esc(s.title)}</b>
                <span class="r">${esc([s.room, getProjectTitle(s.project)].filter(Boolean).join(' · '))}</span>
                ${ppl.length ? `<span class="avs">${ppl.slice(0,5).map(m => avatar(m.name,'sm')).join('')}</span>` : ''}
              </button>`;
            }).join('')}
            <button type="button" class="add" data-act="add" data-kind="session" data-date="${key}">+ Session</button>
          </section>
        `;
      }).join('');

      return vhead('Studio-Kalender', 'Sessions und Raumbelegung. Doppelbuchungen werden markiert.', `<button class="btn primary" type="button" data-act="add" data-kind="session" data-date="${today}">+ Session</button>`)
        + navRow
        + `<div class="days">${cols}</div>`;
    }

        const part = line.split('|').map(x => x.trim());
        const qty = Number(part[1] || 1);
        const price = Number((part[2] || '0').replace(',', '.'));
        return sum + (qty * price);
      }, 0);
    }

    function bindUI() {
      document.querySelectorAll('[data-act]').forEach(el => {
        const action = el.dataset.act;
        el.onclick = () => {
          const id = el.dataset.id;
          const kind = el.dataset.kind;
          const view = el.dataset.view;
          const val = el.dataset.v;
          const to = el.dataset.to;
          const date = el.dataset.date;
          const project = el.dataset.project;

          if (action === 'nav') { state.view = view; render(); return; }
          if (action === 'open-project') { state.curProject = id; state.view = 'project'; render(); return; }
          if (action === 'add') { openForm(kind, null, date ? { date } : project ? { project } : {}); return; }
          if (action === 'edit') { openForm(kind, id); return; }
          if (action === 'team-filter') { state.teamFilter = val; render(); return; }
          if (action === 'project-mode') { state.projectMode = val; render(); return; }
          if (action === 'task-mode') { state.taskMode = val; render(); return; }
          if (action === 'week') { state.weekOffset += Number(el.dataset.d || 0); render(); return; }
          if (action === 'status') { const member = data.members[id]; if (member) { const idx = STATUS_ORDER.indexOf(member.status); member.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length]; saveData(); render(); } return; }
          if (action === 'toggle-task') { const task = data.tasks[id]; if (task) { task.done = !task.done; task.status = task.done ? 'done' : 'todo'; saveData(); render(); } return; }
          if (action === 'toggle-check') { const item = data.checks[id]; if (item) { item.done = !item.done; saveData(); render(); } return; }
          if (action === 'move-project') { const item = data.projects[id]; if (item) { item.stage = Number(to); saveData(); render(); } return; }
          if (action === 'move-task') { const item = data.tasks[id]; if (item) { item.status = to; item.done = to === 'done'; saveData(); render(); } return; }
          if (action === 'pdf-order') { const item = data.orders[id]; if (item) printOrder(item); return; }
          if (action === 'pdf-split') { const item = data.projects[id]; if (item) printSplit(item); return; }
          if (action === 'cycle-version') { const item = data.versions[id]; if (item) { const arr = ['review','changes','approved']; const idx = arr.indexOf(item.status || 'review'); item.status = arr[(idx + 1) % arr.length]; saveData(); render(); } return; }
        };
      });

      const assignee = document.getElementById('flt_assignee');
      const project = document.getElementById('flt_project');
      const done = document.getElementById('flt_done');
      if (assignee) assignee.onchange = e => { state.taskFilters.assignee = e.target.value; render(); };
      if (project) project.onchange = e => { state.taskFilters.project = e.target.value; render(); };
      if (done) done.onchange = e => { state.taskFilters.done = e.target.checked; render(); };

      const requestForm = document.getElementById('requestForm');
      if (requestForm) requestForm.addEventListener('submit', e => {
        e.preventDefault();
        const form = new FormData(e.target);
        const projectId = uid('project');
        data.projects[projectId] = {
          id: projectId,
          title: form.get('title'),
          artist: form.get('name'),
          type: form.get('type') || 'Single',
          release: form.get('release') || '',
          stage: 0,
          lead: ''
        };
        saveData();
        toast('Danke! Die Anfrage ist eingegangen.');
        state.view = 'projects';
        render();
      });
    }

        fields:[
          {key:'name',label:'Name',type:'text',required:true},
          {key:'role',label:'Rolle',type:'text'},
          {key:'status',label:'Status',type:'select',options:[['studio','Im Studio'],['remote','Remote'],['frei','Verfügbar'],['weg','Abwesend']]},
          {key:'focus',label:'Aktueller Fokus',type:'text'},
          {key:'bio',label:'Kurzvita',type:'textarea'}
        ]
      },
      project: {
        col:'projects',
        title:'Projekt',
        defaults:{type:'Single',stage:0},
        fields:[
          {key:'title',label:'Titel',type:'text',required:true},
          {key:'artist',label:'Künstler*in',type:'text',half:true},
          {key:'type',label:'Art',type:'select',options:[['Single','Single'],['EP','EP'],['Album','Album'],['Remix','Remix'],['Auftrag','Auftrag']],half:true},
          {key:'stage',label:'Phase',type:'select',options:STAGES.map((v,i)=>[String(i),v]),half:true},
          {key:'lead',label:'Projektleitung',type:'select',options:[['','Keine'], ...asList(data.members).map(m => [m.id, m.name])],half:true},
          {key:'bpm',label:'BPM',type:'number',half:true},
          {key:'key',label:'Tonart',type:'text',half:true},
          {key:'release',label:'Release-Termin',type:'date'}
        ]
      },
      task: {
        col:'tasks',
        title:'Aufgabe',
        defaults:{prio:'normal',status:'todo'},
        fields:[
          {key:'title',label:'Aufgabe',type:'text',required:true},
          {key:'project',label:'Projekt',type:'select',options:[['','Kein Projekt'], ...asList(data.projects).map(p => [p.id,p.title])],half:true},
          {key:'assignee',label:'Zuständig',type:'select',options:[['','Niemand'], ...asList(data.members).map(m => [m.id,m.name])],half:true},
          {key:'due',label:'Fällig am',type:'date',half:true},
          {key:'prio',label:'Priorität',type:'select',options:[['normal','Normal'],['hoch','Dringend']],half:true},
          {key:'status',label:'Stand',type:'select',options:[['todo','Offen'],['doing','In Arbeit'],['review','Review'],['done','Erledigt']]}
        ]
      },
      session: {
        col:'sessions',
        title:'Session',
        defaults:{start:'10:00',end:'13:00',room:'Control Room'},
        fields:[
          {key:'title',label:'Titel',type:'text',required:true},
          {key:'date',label:'Datum',type:'date',required:true},
          {key:'room',label:'Raum',type:'select',options:[['Live Room','Live Room'],['Control Room','Control Room'],['Vocal Booth','Vocal Booth'],['Remote','Remote']],half:true},
          {key:'start',label:'Beginn',type:'time',required:true,half:true},
          {key:'end',label:'Ende',type:'time',required:true,half:true},
          {key:'project',label:'Projekt',type:'select',options:[['','Kein Projekt'], ...asList(data.projects).map(p => [p.id,p.title])]}
        ]
      },
      order: {
        col:'orders',
        title:'Auftrag',
        defaults:{status:'draft'},
        fields:[
          {key:'customer',label:'Kunde',type:'text',required:true},
          {key:'project',label:'Projekt',type:'select',options:[['','Kein Projekt'], ...asList(data.projects).map(p => [p.id,p.title])],half:true},
          {key:'date',label:'Auftragsdatum',type:'date',required:true,half:true},
          {key:'delivery',label:'Lieferung bis',type:'date',half:true},
          {key:'itemsText',label:'Positionen',type:'textarea',rows:5,required:true},
          {key:'note',label:'Notiz',type:'textarea',rows:3},
          {key:'status',label:'Stand',type:'select',options:[['draft','Entwurf'],['confirmed','Bestätigt'],['billed','Abgerechnet']]}
        ]
      },
      check: {
        col:'checks',
        title:'Checklisten-Punkt',
        defaults:{group:'Marketing'},
        fields:[
          {key:'project',label:'Projekt',type:'select',options:[['','Kein Projekt'], ...asList(data.projects).map(p => [p.id,p.title])],half:true},
          {key:'label',label:'Punkt',type:'text',required:true,half:true},
          {key:'group',label:'Bereich',type:'select',options:[['Rechtliches','Rechtliches'],['Metadaten','Metadaten'],['Artwork','Artwork'],['Distribution','Distribution'],['Marketing','Marketing']],half:true}
        ]
      },
      split: {
        col:'splits',
        title:'Beteiligte*r',
        fields:[
          {key:'project',label:'Projekt',type:'select',options:[['','Kein Projekt'], ...asList(data.projects).map(p => [p.id,p.title])],half:true},
          {key:'name',label:'Name',type:'text',required:true,half:true},
          {key:'role',label:'Rolle',type:'text',half:true},
          {key:'comp',label:'Komposition %',type:'number',half:true},
          {key:'master',label:'Master %',type:'number',half:true}
        ]
      },
      version: {
        col:'versions',
        title:'Version',
        defaults:{kind:'Mix',status:'review'},
        fields:[
          {key:'project',label:'Projekt',type:'select',options:[['','Kein Projekt'], ...asList(data.projects).map(p => [p.id,p.title])],half:true},
          {key:'label',label:'Bezeichnung',type:'text',required:true,half:true},
          {key:'kind',label:'Art',type:'select',options:[['Mix','Mix'],['Stems','Stems'],['Master','Master'],['Referenz','Referenz'],['Demo','Demo']],half:true},
          {key:'date',label:'Datum',type:'date',half:true},
          {key:'link',label:'Link zur Datei',type:'text'},
          {key:'status',label:'Stand',type:'select',options:[['review','Zur Abnahme'],['changes','Änderungen nötig'],['approved','Freigegeben']]},
          {key:'notes',label:'Notizen',type:'textarea'}
        ]
      },
      feedback: {
        col:'feedback',
        title:'Kommentar',
        fields:[
          {key:'text',label:'Kommentar',type:'textarea',required:true},
          {key:'by',label:'Von',type:'text',required:true}
        ]
      }
    };

    function getDef(kind) { return FORM_DEFS[kind] || FORM_DEFS.member; }
    function fieldHTML(field, value) {
      const id = 'f_' + field.key;
      const val = value == null ? '' : value;
      if (field.type === 'select') {
        const opts = (field.options || []).map(([v,label]) => `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(label)}</option>`).join('');
        return `<div class="fld${field.half ? ' half' : ''}"><label for="${id}">${field.label}</label><select id="${id}" name="${field.key}">${opts}</select></div>`;
      }
      if (field.type === 'textarea') {
        return `<div class="fld${field.half ? ' half' : ''}"><label for="${id}">${field.label}</label><textarea id="${id}" name="${field.key}" rows="${field.rows || 3}" ${field.required ? 'required' : ''}>${esc(val)}</textarea></div>`;
      }
      return `<div class="fld${field.half ? ' half' : ''}"><label for="${id}">${field.label}</label><input id="${id}" name="${field.key}" type="${field.type}" value="${esc(val)}" ${field.required ? 'required' : ''}></div>`;
    }

    function openForm(kind, id, extra = {}) {
      const def = getDef(kind);
      const existing = id ? data[def.col][id] : null;
      const values = { ...(def.defaults || {}), ...extra, ...(existing || {}) };

      overlay.hidden = false;
      overlay.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <form id="modal-form" novalidate>
            <h2>${id ? def.title + ' bearbeiten' : def.title + ' anlegen'}</h2>
            <div class="fields">
              ${def.fields.map(f => fieldHTML(f, values[f.key])).join('')}
            </div>
            <div class="mactions">
              ${id ? '<button class="btn danger" type="button" data-act="delete-form">Löschen</button>' : ''}
              <span class="spacer"></span>
              <button class="btn ghost" type="button" data-act="close-form">Abbrechen</button>
              <button class="btn primary" type="submit">Speichern</button>
            </div>
          </form>
        </div>
      `;

      overlay.querySelector('[data-act="close-form"]')?.addEventListener('click', closeForm);
      overlay.querySelector('[data-act="delete-form"]')?.addEventListener('click', () => {
        if (!id) return;
        delete data[def.col][id];
        saveData();
        closeForm();
        render();
      });

      const form = overlay.querySelector('#modal-form');
      form.addEventListener('submit', e => {
        e.preventDefault();
        const payload = {};
        let valid = true;

        def.fields.forEach(f => {
          const el = form.elements[f.key];
          if (!el) return;
          let v = el.value;
          if (f.type === 'number' && v !== '') v = Number(String(v).replace(',', '.'));
          if (f.type === 'date' && v === '') v = null;
          if (f.type === 'time' && v === '') v = null;
          payload[f.key] = v;
          if (f.required && (v === '' || v === null || v === undefined)) valid = false;
        });

        if (!valid) { toast('Bitte alle Pflichtfelder ausfüllen.'); return; }
        if (kind === 'session' && payload.end <= payload.start) { toast('Das Ende muss nach dem Beginn liegen.'); return; }
        if (kind === 'order' && !String(payload.itemsText || '').trim()) { toast('Bitte mindestens eine Position eintragen.'); return; }

        if (id) {
          data[def.col][id] = { ...data[def.col][id], ...payload };
        } else {
          const newId = uid(kind);
          data[def.col][newId] = { id: newId, ...payload, created: Date.now() };
        }
        saveData();
        closeForm();
        render();
      });
    }

    function closeForm() {
      overlay.hidden = true;
      overlay.innerHTML = '';
    }

    document.addEventListener('click', e => {
      const langBtn = e.target.closest('[data-lang]');
      if (langBtn) { state.lang = langBtn.dataset.lang; render(); return; }

      const el = e.target.closest('[data-act]');
      if (!el) return;

      const action = el.dataset.act;
      const id = el.dataset.id;
      const kind = el.dataset.kind;
      const view = el.dataset.view;
      const val = el.dataset.v;
      const to = el.dataset.to;
      const date = el.dataset.date;
      const project = el.dataset.project;

      if (action === 'nav') { state.view = view; render(); return; }
      if (action === 'open-project') { state.curProject = id; state.view = 'project'; render(); return; }
      if (action === 'add') { openForm(kind, null, date ? { date } : project ? { project } : {}); return; }
      if (action === 'edit') { openForm(kind, id); return; }
      if (action === 'team-filter') { state.teamFilter = val; render(); return; }
      if (action === 'project-mode') { state.projectMode = val; render(); return; }
      if (action === 'task-mode') { state.taskMode = val; render(); return; }
      if (action === 'week') { state.weekOffset += Number(el.dataset.d || 0); render(); return; }
      if (action === 'status') { const member = data.members[id]; if (member) { const idx = STATUS_ORDER.indexOf(member.status); member.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length]; saveData(); render(); } return; }
      if (action === 'toggle-task') { const task = data.tasks[id]; if (task) { task.done = !task.done; task.status = task.done ? 'done' : 'todo'; saveData(); render(); } return; }
      if (action === 'toggle-check') { const item = data.checks[id]; if (item) { item.done = !item.done; saveData(); render(); } return; }
      if (action === 'move-project') { const item = data.projects[id]; if (item) { item.stage = Number(to); saveData(); render(); } return; }
      if (action === 'move-task') { const item = data.tasks[id]; if (item) { item.status = to; item.done = to === 'done'; saveData(); render(); } return; }
      if (action === 'pdf-order') { const item = data.orders[id]; if (item) printOrder(item); return; }
      if (action === 'pdf-split') { const item = data.projects[id]; if (item) printSplit(item); return; }
      if (action === 'cycle-version') { const item = data.versions[id]; if (item) { const arr = ['review','changes','approved']; const idx = arr.indexOf(item.status || 'review'); item.status = arr[(idx + 1) % arr.length]; saveData(); render(); } return; }
      if (action === 'close-form') { closeForm(); }
    });

    document.addEventListener('submit', e => {
      if (e.target.id === 'requestForm') {
        e.preventDefault();
        const form = new FormData(e.target);
        const projectId = uid('project');
        data.projects[projectId] = {
          id: projectId,
          title: form.get('title'),
          artist: form.get('name'),
          type: form.get('type') || 'Single',
          release: form.get('release') || '',
          stage: 0,
          lead: ''
        };
        saveData();
        toast('Danke! Die Anfrage ist eingegangen.');
        state.view = 'projects';
        render();
      }
    });

    document.addEventListener('change', e => {
      if (e.target.id === 'flt_assignee') { state.taskFilters.assignee = e.target.value; render(); }
      if (e.target.id === 'flt_project') { state.taskFilters.project = e.target.value; render(); }
      if (e.target.id === 'flt_done') { state.taskFilters.done = e.target.checked; render(); }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !overlay.hidden) closeForm();
    });

    render();
  })();
  </script>
</body>
</html>
